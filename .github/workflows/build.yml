name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          if [ -f "FuelDistributionApp.zip" ]; then
            unzip -o FuelDistributionApp.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK
        run: |
          # يبحث عن ملف gradlew في أي مجلد فرعي (حتى لو كان اسم المجلد مختلفاً)
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ ملف gradlew غير موجود!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NajdaFuelApp-APK
          path: '**/build/outputs/apk/debug/*.apk'
