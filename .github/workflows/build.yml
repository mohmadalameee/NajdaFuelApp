name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          if [ -f "FuelDistributionApp.zip" ]; then
            unzip -o FuelDistributionApp.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permissions
        run: |
          find . -name "gradlew" -exec chmod +x {} \; || true

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          elif [ -f "FuelDistributionApp/gradlew" ]; then
            cd FuelDistributionApp && ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NajdaFuelApp-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
