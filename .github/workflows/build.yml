name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          if [ -f "FuelDistributionApp.zip" ]; then
            unzip -o FuelDistributionApp.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: البحث عن مجلد المشروع
        id: find_project
        run: |
          PROJECT_DIR=$(find . -name "build.gradle" -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ لم يتم العثور على ملف build.gradle!"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "✅ تم العثور على المشروع في: $PROJECT_DIR"

      - name: تثبيت أحدث إصدار من Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'  # إصدار حديث ومستقر

      - name: بناء ملف APK
        run: |
          cd ${{ steps.find_project.outputs.dir }}
          gradle assembleDebug --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: NajdaFuelApp-APK
          path: '**/build/outputs/apk/debug/*.apk'
